<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastro exclusivo da Comunidade Unidos em Cristo.">
  <title>Concluir cadastro | Comunidade Unidos em Cristo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card register-card" aria-labelledby="register-title">
      <a href="index.html#inicio" class="login-logo" aria-label="Voltar para o início">
        <img src="assets/logo/logo.png" alt="Comunidade Unidos em Cristo">
      </a>
      <h1 id="register-title">Conclua seu cadastro</h1>
      <p>Crie seu acesso à área exclusiva da Comunidade Unidos em Cristo.</p>

      <div class="register-note" role="note">
        Esta página será liberada por um link exclusivo enviado após a confirmação do seu pagamento.
      </div>

      <form class="login-form" action="#" method="post">
        <label for="nome">
          Nome completo
          <input id="nome" name="nome" type="text" autocomplete="name" required>
        </label>

        <label for="email">
          E-mail
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label for="senha">
          Crie uma senha
          <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <label for="confirmar-senha">
          Confirme sua senha
          <input id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" minlength="8" required>
        </label>

        <button class="btn btn-red login-submit" type="submit">Concluir cadastro</button>
        <a class="btn login-back" href="login.html">Já tenho cadastro</a>
        <a class="btn login-back" href="index.html#inicio">← Voltar ao início</a>
      </form>
    </section>
  </main>
</body>
</html>
