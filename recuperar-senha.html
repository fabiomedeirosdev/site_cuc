<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha | Comunidade Unidos em Cristo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="page-title">
      <a href="index.html#inicio" class="login-logo" aria-label="Voltar para o início"><img src="assets/logo/logo.png" alt="Comunidade Unidos em Cristo"></a>
      <h1 id="page-title">Recupere seu acesso</h1>
      <p>Informe seu e-mail para receber as instruções de recuperação.</p>
      <form class="login-form" action="#" method="post">
        <label for="email">E-mail<input id="email" name="email" type="email" autocomplete="email" required></label>
        <button class="btn btn-red login-submit" type="submit">Enviar instruções</button>
        <a class="btn login-back" href="login.html">Voltar ao login</a>
      </form>
    </section>
  </main>
</body>
</html>
