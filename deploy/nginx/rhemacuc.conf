# Exemplo para Linux/Nginx. Ajustar diretórios e instalar certificado TLS
# válido para rhemacuc.com.br e www.rhemacuc.com.br antes de habilitar.
# Backend de produção (WSGI/ASGI) deve escutar apenas em 127.0.0.1:8000.
server {
    listen 80;
    server_name rhemacuc.com.br www.rhemacuc.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://rhemacuc.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.rhemacuc.com.br;
    ssl_certificate /etc/letsencrypt/live/rhemacuc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhemacuc.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://rhemacuc.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name rhemacuc.com.br;
    ssl_certificate /etc/letsencrypt/live/rhemacuc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhemacuc.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/rhemacuc/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 6m;

    # Sobrescrever os cabeçalhos recebidos, preservando a origem HTTPS real.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_read_timeout 30s;

    # Sem barra após :8000: manter o prefixo /api/ ao encaminhar ao Django.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /static/ {
        alias /var/lib/rhemacuc/static/;
        autoindex off;
    }
    location /media/ {
        alias /var/lib/rhemacuc/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }
    location /icons/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    # Rotas do React, incluindo links recebidos por e-mail.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
